[project]
name = "ghostshield-aegis"
version = "0.1.0"
description = "AEGIS ForkGuard counterfactual incident review for GhostShield Sentinel"

[dependencies]
jaclang = ">=0.16.7"

[plugins.scale.server]
port = 8012
host = "127.0.0.1"

[test]
directory = "tests"

[scripts]
serve = "jac start main.jac --port 8012 --no_client"
test = "jac test tests/aegis_tests.jac"
