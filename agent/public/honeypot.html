<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Terminal — user</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d0d0d;
    color: #d4d4d4;
    font-family: "SF Mono", Menlo, Monaco, monospace;
    font-size: 13px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  #output {
    flex: 1;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line { margin: 0 0 2px 0; }
  .prompt-line { color: #9cdcfe; }
  .blocked-line { color: #f14c4c; }
  .stderr-line { color: #f14c4c; }
  #input-row { display: flex; align-items: center; margin-top: 4px; }
  #prompt-label { color: #4ec9b0; margin-right: 6px; }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #d4d4d4;
    font: inherit;
  }
</style>
</head>
<body>
  <div id="output"></div>
  <div id="input-row">
    <span id="prompt-label">$</span>
    <input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
  </div>
  <script src="honeypot.js"></script>
</body>
</html>
