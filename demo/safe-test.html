<!--
  SIMULATED FIXTURE — Sentinel demo
  A plain, benign page: same-origin form, small same-origin fetch, and a
  normal link. Used to prove Sentinel does NOT flag ordinary browsing.
  Expected: low/zero risk score, decision "allow".
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sentinel Demo — Safe Page</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 60px auto; line-height: 1.6; color: #0f1720; }
  .banner { background: #10b981; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; display: inline-block; margin-bottom: 16px; }
  input, button { font: inherit; padding: 8px 10px; }
  code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <span class="banner">SENTINEL DEMO — SAFE PAGE</span>
  <h1>Community Notice Board</h1>
  <p>An ordinary page with ordinary behavior. Nothing here should ever be
     flagged by Sentinel.</p>

  <form method="GET" action="safe-test.html">
    <label>Search notices: <input type="text" name="q" placeholder="e.g. yard sale" /></label>
    <button type="submit">Search (same-origin GET)</button>
  </form>

  <p><a href="suspicious-test.html">Next demo: suspicious page →</a></p>
  <p><a href="redirect-test.html">Next demo: redirect chain →</a></p>

  <script>
    // A small, same-origin GET — should not trigger any rule.
    fetch("safe-test.html").then(() => console.log("[demo] small same-origin fetch complete"));
  </script>
</body>
</html>
