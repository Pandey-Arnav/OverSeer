<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostShield</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M12 3 19 6v5c0 4.7-2.8 8.1-7 10-4.2-1.9-7-5.3-7-10V6l7-3Z" />
              <path d="m9.1 12 1.8 1.8 4.2-4.2" />
            </svg>
          </span>
          <span class="brand-copy">
            <strong>GhostShield</strong>
            <small>Sentinel + AEGIS</small>
          </span>
        </div>

        <label class="protection-control" for="protection-toggle">
          <span id="toggle-label">Protection on</span>
          <span class="switch">
            <input
              id="protection-toggle"
              type="checkbox"
              role="switch"
              aria-describedby="status-description"
            />
            <span class="switch-track" aria-hidden="true">
              <span class="switch-thumb"></span>
            </span>
          </span>
        </label>
      </header>

      <section id="status-card" class="status-card" aria-live="polite">
        <div id="status-icon" class="status-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 3 19 6v5c0 4.7-2.8 8.1-7 10-4.2-1.9-7-5.3-7-10V6l7-3Z" />
            <path id="status-check" d="m9.1 12 1.8 1.8 4.2-4.2" />
          </svg>
        </div>
        <div class="status-copy">
          <span class="section-label">Status</span>
          <strong id="status-title">Checking protection…</strong>
          <p id="status-description">Loading the current runtime policy.</p>
        </div>
        <span id="status-badge" class="status-badge">Loading</span>
      </section>

      <section class="summary-section" aria-labelledby="summary-title">
        <div class="section-heading">
          <div>
            <span class="section-label">Activity</span>
            <h1 id="summary-title">Incidents today</h1>
          </div>
          <span id="today-date" class="today-date"></span>
        </div>

        <div class="metrics">
          <article class="metric metric-total">
            <span class="metric-icon" aria-hidden="true">◎</span>
            <strong id="count-today">0</strong>
            <span>Total</span>
          </article>
          <article class="metric metric-blocked">
            <span class="metric-icon" aria-hidden="true">×</span>
            <strong id="count-blocked">0</strong>
            <span>Blocked</span>
          </article>
          <article class="metric metric-warned">
            <span class="metric-icon" aria-hidden="true">!</span>
            <strong id="count-warned">0</strong>
            <span>Warned</span>
          </article>
        </div>
      </section>

      <section class="recent-section" aria-labelledby="recent-title">
        <div class="section-heading recent-heading">
          <div>
            <span class="section-label">Timeline</span>
            <h2 id="recent-title">Recent incidents</h2>
          </div>
          <span id="recent-count" class="recent-count">0 events</span>
        </div>

        <ul id="recent-list" class="recent-list" aria-live="polite">
          <li class="empty-state">
            <span class="empty-icon" aria-hidden="true">✓</span>
            <strong>No incidents yet</strong>
            <p>Sentinel will surface suspicious browser behavior here.</p>
          </li>
        </ul>
      </section>

      <footer class="popup-footer">
        <label class="ai-setting" for="ai-toggle">
          <span>
            <strong>AI explanations</strong>
            <small>Explain incidents in plain language</small>
          </span>
          <input id="ai-toggle" type="checkbox" />
        </label>

        <button id="open-dashboard" class="dashboard-button" type="button">
          <span>Open dashboard</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </footer>
    </main>

    <script src="../shared/constants.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="../storage/incidents.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
