<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sentinel Dashboard</title>
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header class="page-header">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <h1>Sentinel Dashboard</h1>
    </div>
    <button id="clear-history" class="danger-button">Clear history</button>
  </header>

  <section class="summary-cards">
    <div class="card">
      <span class="card-value" id="summary-total">0</span>
      <span class="card-label">Total incidents</span>
    </div>
    <div class="card card-blocked">
      <span class="card-value" id="summary-blocked">0</span>
      <span class="card-label">Blocked</span>
    </div>
    <div class="card card-warned">
      <span class="card-value" id="summary-warned">0</span>
      <span class="card-label">Warnings</span>
    </div>
    <div class="card">
      <span class="card-value" id="summary-avg-score">0</span>
      <span class="card-label">Average risk score</span>
    </div>
  </section>

  <section class="filters">
    <label>
      Severity
      <select id="filter-severity">
        <option value="">All</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </label>
    <label>
      Decision
      <select id="filter-decision">
        <option value="">All</option>
        <option value="allow">Allowed</option>
        <option value="warn">Warned</option>
        <option value="blocked">Blocked</option>
        <option value="detected_not_blocked">Detected (not blockable)</option>
      </select>
    </label>
    <label>
      Event type
      <select id="filter-event-type">
        <option value="">All</option>
        <option value="fetch_request">fetch</option>
        <option value="xhr_request">XHR</option>
        <option value="send_beacon">sendBeacon</option>
        <option value="form_submission">form submission</option>
        <option value="redirect">redirect</option>
        <option value="history_change">history change</option>
        <option value="clipboard_access">clipboard</option>
        <option value="hidden_iframe">hidden iframe</option>
      </select>
    </label>
    <label class="filter-domain">
      Domain contains
      <input type="text" id="filter-domain" placeholder="example.com" />
    </label>
  </section>

  <table class="incident-table">
    <thead>
      <tr>
        <th>Time</th>
        <th>Page</th>
        <th>Destination</th>
        <th>Event</th>
        <th>Score</th>
        <th>Decision</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="incident-rows"></tbody>
  </table>
  <p id="empty-state" class="empty-state" hidden>No incidents match the current filters.</p>

  <div id="confirm-overlay" class="confirm-overlay" hidden>
    <div class="confirm-box">
      <p>Clear all stored incidents? This cannot be undone.</p>
      <div class="confirm-actions">
        <button id="confirm-clear" class="danger-button">Clear all</button>
        <button id="cancel-clear" class="secondary-button">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../shared/constants.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../storage/incidents.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
